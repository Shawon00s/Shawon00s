<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Sudipto Roy Shawon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="45%"  stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00D9FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#sky)"/>

  <!-- drifting wave layers -->
  <path fill="#0D1117" opacity="0.16"
        d="M0,132 C200,104 400,160 600,132 C800,104 1000,160 1200,132 C1400,104 1600,160 1800,132 C2000,104 2200,160 2400,132 L2400,200 L0,200 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1200,0" dur="18s" repeatCount="indefinite"/>
  </path>
  <path fill="#0D1117" opacity="0.28"
        d="M0,150 C180,126 360,176 600,150 C840,124 1020,176 1200,150 C1380,126 1560,176 1800,150 C2040,124 2220,176 2400,150 L2400,200 L0,200 Z">
    <animateTransform attributeName="transform" type="translate" values="-1200,0; 0,0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path fill="#0D1117" opacity="0.55"
        d="M0,168 C160,148 320,188 600,168 C880,148 1040,188 1200,168 C1360,148 1520,188 1800,168 C2080,148 2240,188 2400,168 L2400,200 L0,200 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1200,0" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- name -->
  <text x="600" y="92" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    Sudipto Roy Shawon
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- underline shimmer -->
  <rect x="420" y="106" width="360" height="2" fill="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="600" y="134" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="400" fill="#E6EDF3" opacity="0.92">
    CSE Undergrad @ NSU  •  Deep Learning &amp; Full-Stack
    <animate attributeName="opacity" from="0" to="0.92" dur="1.8s" fill="freeze"/>
  </text>
</svg>
